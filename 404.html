<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>QuickLesson</title>
  <link rel="canonical" href="https://quicklesson5min.com/ja/" />
  <link rel="alternate" hreflang="ja" href="https://quicklesson5min.com/ja/" />
  <link rel="alternate" hreflang="en" href="https://quicklesson5min.com/en/" />
  <link rel="alternate" hreflang="fr" href="https://quicklesson5min.com/fr/" />
  <link rel="alternate" hreflang="es" href="https://quicklesson5min.com/es/" />
  <link rel="alternate" hreflang="x-default" href="https://quicklesson5min.com/ja/" />
  <meta http-equiv="refresh" content="0; url=/ja/" />
  <script>
    (function () {
      var supported = { ja: 1, en: 1, fr: 1, es: 1 };
      var aliases = { jp: "ja", jpn: "ja", nihongo: "ja", eng: "en", english: "en", us: "en", gb: "en", uk: "en", fra: "fr", french: "fr", spa: "es", spanish: "es" };
      var seg = (location.pathname.split("/").filter(Boolean)[0] || "").toLowerCase();
      var target = supported[seg] ? seg : aliases[seg];
      if (!target) {
        var nav = (navigator.language || navigator.userLanguage || "ja").slice(0, 2).toLowerCase();
        target = supported[nav] ? nav : "ja";
      }
      location.replace("/" + target + "/");
    })();
  </script>
</head>
<body>
  <p><a href="/ja/">QuickLesson</a></p>
</body>
</html>
